version: '3.8'

services:
  # Shell executor container - Kali Linux with security tools
  shell-executor:
    image: yohannesgk/mini-kali-slim:latest
    container_name: blacksmith-executor
    ports:
      - "9756:9756"
    volumes:
      - ./outputs:/root/outputs
    restart: unless-stopped

  # Web Dashboard (Flask)
  dashboard:
    build: .
    container_name: blacksmith-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./blacksmithAI:/app
      - ./store:/app/store
      - ./outputs:/app/outputs
    environment:
      - container_uri=http://shell-executor:9756/exec
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      - shell-executor
    restart: unless-stopped
    command: python web/dashboard.py

  # Note: Ollama runs on host machine, not in container
  # Install Ollama from https://ollama.ai and pull models:
  #   ollama pull mistral-nemo:12b-pentest
  #   ollama pull qwen3:8b-pentest
